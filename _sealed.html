<!doctype html><meta charset="utf-8">
<div id="out">…</div>
<iframe src="index.html#/home" width="1400" height="800" style="border:0"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
addEventListener("load", async () => {
  const f = document.querySelector("iframe"), d = f.contentDocument, w = f.contentWindow;
  await d.fonts.ready; await wait(1400);
  const out = [];
  const btns = [...d.querySelectorAll(".theme button")];
  out.push(`header buttons: ${btns.map(b => b.dataset.theme + "=" + b.getAttribute("aria-label")).join(" | ")}`);
  out.push(`icons: ${btns.map(b => b.querySelector("svg") ? "svg" : "NONE").join(",")}`);
  btns.find(b => b.dataset.theme === "sealed").click();
  await wait(700);
  const cs = w.getComputedStyle(d.documentElement);
  out.push(`html data-theme=${d.documentElement.dataset.theme} ground=${cs.getPropertyValue("--ground").trim()} accent=${cs.getPropertyValue("--accent").trim()} focus=${cs.getPropertyValue("--focus").trim()}`);
  const live = [...d.querySelectorAll(".theme button")];
  out.push(`pressed (live): ${live.filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.dataset.theme).join(",")}`);
  out.push(`all live: ${live.map(b => b.dataset.theme + ":" + b.getAttribute("aria-pressed")).join(" ")}`);
  out.push(`panel radio sealed checked=${d.getElementById("attune-theme-sealed")?.checked}`);
  out.push(`stored=${JSON.parse(w.localStorage.getItem("afstemmen.v1")||"{}").theme}`);
  out.push(`body bg=${w.getComputedStyle(d.body).backgroundColor}`);
  document.getElementById("out").textContent = out.join(" ||| ");
});
</script>
