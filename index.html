<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mode="full" data-audience="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safa Mohalaia — UX / UI Designer, Amsterdam</title>
<meta name="description" content="Portfolio of Safa Mohalaia, a UX/UI designer in Amsterdam. Healthcare, civic infrastructure and community platforms. This site rearranges itself depending on who is reading it.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<!-- Fonts. Four faces, each doing one job — see tokens.css for why each.
     display=swap so text is readable before the webfont lands; the fallback
     stacks are metric-close enough that the swap does not shift layout. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200..700;1,9..40,200..500&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..600,0..100,0..1&family=Atkinson+Hyperlegible:wght@400;700&display=swap">

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/work.css">
<link rel="stylesheet" href="styles/cv.css">
<link rel="stylesheet" href="styles/lab.css">
<link rel="stylesheet" href="styles/hover.css">
<link rel="stylesheet" href="styles/cat.css">
<link rel="stylesheet" href="styles/router.css">
<link rel="stylesheet" href="styles/attune.css">
<link rel="stylesheet" href="styles/detail.css">
<link rel="stylesheet" href="styles/full.css">
<link rel="stylesheet" href="styles/calm.css">

<!-- Applied before first paint so nobody in calm mode ever sees one frame
     of the thing they asked not to see — and nobody on a light desktop gets
     a flash of near-black before the theme resolves. The attribute is on
     <html> in the markup too, so a document with no JavaScript at all is
     still a designed one rather than an unstyled one. -->
<script>
  try {
    const s = JSON.parse(localStorage.getItem("afstemmen.v1") || "{}");
    const r = document.documentElement;
    r.dataset.theme    = s.theme    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    r.dataset.mode     = s.mode     || (matchMedia("(prefers-reduced-motion: reduce)").matches ? "calm" : "full");
    r.dataset.contrast = s.contrast || (matchMedia("(prefers-contrast: more)").matches ? "high" : "normal");
    r.dataset.reading  = s.reading  || "default";
    r.dataset.textsize = s.textsize || "default";
    r.dataset.audience = s.audience || "open";
    r.lang = s.lang || ((navigator.language||"").toLowerCase().startsWith("nl") ? "nl" : "en");
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<!-- The site says out loud what it changed. Polite, so it never interrupts
     a sentence in progress; atomic, so partial messages are never read. -->
<div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- =====================================================================
     THE GROUND
     In full mode this canvas is a live field that warms where the pointer
     is: the page notices you before it says it does. In calm mode the
     element is removed from the DOM entirely — not hidden, removed — and
     a printed grain takes its place in CSS.
     aria-hidden because it is decoration; it carries no information that
     is not also in the text.
     ===================================================================== -->
<canvas id="field" aria-hidden="true" data-decorative></canvas>

<!-- =====================================================================
     ATTUNE — built in JS so that a no-JS visitor gets a plain, complete,
     perfectly readable document rather than a panel full of dead controls.
     ===================================================================== -->
<div id="attune-root"></div>

<p class="banner" id="banner"></p>

<header class="site-head rail">
  <a class="wordmark" href="#main">
    <span class="wordmark__name">Safa Mohalaia</span>
    <span class="wordmark__role" data-i18n="role"></span>
  </a>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div id="lang-root"></div>

  <button id="attune-open" type="button" aria-expanded="false" aria-controls="attune-panel">
    <span aria-hidden="true">◐</span>
    <span data-i18n="attuneTitle">Attune</span>
  </button>
</header>

<main id="main" tabindex="-1">
  <!-- One route at a time. Which sections land here, and in what order, is
       decided by the route and by who the visitor said they were. -->
  <div id="view"></div>
</main>

<footer class="site-foot rail">
  <p class="colophon" id="colophon"></p>
</footer>

<noscript>
  <style>
    #attune-open, #field, .tabs { display: none; }
    #view::before {
      content: "This site is built as six pages that rearrange themselves for you. Without JavaScript it cannot route — but nothing here is behind a login. Reach me at safamuh98@icloud.com.";
      display: block; padding: 2rem 0; font-size: 1.1rem;
    }
  </style>
</noscript>

<script type="module" src="scripts/main.js"></script>
</body>
</html>
