<!doctype html><meta charset="utf-8">
<div id="out">…</div>
<iframe src="index.html#/home" width="1300" height="800" style="border:0"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
addEventListener("load", async () => {
  const f = document.querySelector("iframe"), d = f.contentDocument, w = f.contentWindow;
  await d.fonts.ready; await wait(1200);
  d.querySelector('.theme button[data-theme="sealed"]').click();
  await wait(2500);
  const cs = w.getComputedStyle(d.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  document.getElementById("out").textContent = [
    `theme=${d.documentElement.dataset.theme}`,
    `field canvas present=${!!d.getElementById("field")}`,
    `tokens the canvases read: ground=${tok("--ground")} accent-text=${tok("--accent-text")} note=${tok("--note")} text=${tok("--text")}`,
    `swarm host=${d.querySelector(".cat-stage__figure")?.dataset.swarm}`,
  ].join(" ||| ");
});
</script>
